# The iPad app's Xcode project, generated by XcodeGen (`brew install xcodegen`, then `xcodegen` in this folder):
# PokeDaisy.xcodeproj stays out of git. Its build runs Gradle first, which builds the shared screens
# (shared-ui) into the PokeDaisyUI framework this target links.
name: PokeDaisy
options:
  bundleIdPrefix: com.pokedaisy
  deploymentTarget:
    iOS: "16.0"
settings:
  base:
    MARKETING_VERSION: "0.1.0"
    CURRENT_PROJECT_VERSION: "1"
targets:
  PokeDaisy:
    type: application
    platform: iOS
    sources:
      - path: PokeDaisy
      # The Android app's fonts, the same files, copied into the bundle's fonts folder (IosHosts' BundleFonts).
      - path: ../app/src/main/assets/fonts
        type: folder
        buildPhase: resources
    info:
      path: PokeDaisy/Info.plist
      properties:
        CFBundleDisplayName: PokeDaisy
        UILaunchScreen: {}
        UIRequiresFullScreen: false
        UISupportedInterfaceOrientations~ipad:
          - UIInterfaceOrientationPortrait
          - UIInterfaceOrientationPortraitUpsideDown
          - UIInterfaceOrientationLandscapeLeft
          - UIInterfaceOrientationLandscapeRight
        UISupportedInterfaceOrientations:
          - UIInterfaceOrientationPortrait
          - UIInterfaceOrientationLandscapeLeft
          - UIInterfaceOrientationLandscapeRight
        # Compose draws through Metal on its own; it wants this off (CADisableMinimumFrameDurationOnPhone: 120 Hz).
        CADisableMinimumFrameDurationOnPhone: true
    settings:
      base:
        PRODUCT_BUNDLE_IDENTIFIER: com.pokedaisy.app
        TARGETED_DEVICE_FAMILY: "1,2"
        FRAMEWORK_SEARCH_PATHS: "$(SRCROOT)/../shared-ui/build/xcode-frameworks/$(CONFIGURATION)/$(SDK_NAME)"
        OTHER_LDFLAGS: ["$(inherited)", "-framework", "PokeDaisyUI"]
        ENABLE_USER_SCRIPT_SANDBOXING: NO
    preBuildScripts:
      - name: Build the shared screens (Gradle)
        basedOnDependencyAnalysis: false
        script: |
          cd "$SRCROOT/.."
          ./gradlew :shared-ui:embedAndSignAppleFrameworkForXcode
